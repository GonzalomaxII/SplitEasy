spring.application.name=spliteasy-backend

# Lee el archivo .env en tu PC y lo ignora en produccion (Render usa sus propias variables)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Conexion a PostgreSQL (Neon)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (crea y actualiza las tablas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracion de JWT y CORS
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Puerto dinamico (8080 en local, automatico en Render)
server.port=${PORT:8080}
